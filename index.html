<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>About Me</title>
   <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      width:320px;
      padding:30px;
      border-radius:15px;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
      text-align:center;
    }

    img{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #4f8ef7;
    }

    h1{
      margin:15px 0 5px;
      color:#333;
    }

    h3{
      margin:0;
      color:#4f8ef7;
      font-weight:normal;
    }

    p{
      color:#666;
      font-size:14px;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      margin-top:15px;
      padding:10px 20px;
      background:#4f8ef7;
      color:white;
      text-decoration:none;
      border-radius:25px;
    }

    .btn:hover{
      background:#2f6fe0;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="profile.jpg" alt="Profile Picture">

    <h1>Stephanie Miranda</h1>
    <h3>BSIT Student</h3>

    <p>
      Hello! I'm Stephanie, a 3rd Year Bachelor of Science in Information Technology student.
      I enjoy web development, databases, and creating useful web applications.
    </p>

    <a class="btn" href="https://github.com/nie">My GitHub</a>
  </div>

  </body>
  </html>
